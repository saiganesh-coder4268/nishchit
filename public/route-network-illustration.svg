<svg width="800" height="900" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft gradient for connecting paths -->
    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- Group 1: Continuous Connected Transit Lines -->
  <g stroke="url(#routeGradient)" stroke-width="1.5" stroke-linecap="round">
    <!-- Main undulating transit arterial 1 -->
    <path d="M -20 180 C 80 140, 160 220, 260 190 C 380 150, 420 80, 560 110 C 660 130, 720 200, 820 180" stroke-dasharray="4 4" />
    <!-- Main arterial 2 -->
    <path d="M 120 40 C 220 100, 300 60, 420 130 C 520 190, 590 140, 680 240 C 740 310, 790 280, 840 340" />
    <!-- Vertical and looping branches -->
    <path d="M 260 190 C 260 300, 340 360, 380 460 C 410 540, 360 620, 420 720 C 460 780, 580 820, 640 880" stroke-dasharray="5 5" />
    <path d="M 560 110 C 570 240, 680 340, 690 480 C 700 600, 640 700, 740 820" />
    <!-- Bottom cross connection -->
    <path d="M 180 650 C 280 610, 360 680, 480 640 C 600 600, 670 660, 810 620" stroke-dasharray="3 3" />
  </g>

  <!-- Group 2: Stylized School Building (Upper Right: x=580, y=260) -->
  <g stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Main building body -->
    <rect x="580" y="270" width="80" height="50" rx="3" />
    <!-- Center entrance tower -->
    <rect x="608" y="250" width="24" height="70" rx="2" />
    <!-- Gable / triangular roof over tower -->
    <path d="M 604 250 L 620 236 L 636 250 Z" />
    <!-- Flagpole & flag -->
    <line x1="620" y1="236" x2="620" y2="220" />
    <path d="M 620 220 L 630 225 L 620 230 Z" fill="#64748B" fill-opacity="0.3" />
    <!-- Windows -->
    <rect x="588" y="278" width="12" height="12" rx="1.5" />
    <rect x="588" y="298" width="12" height="12" rx="1.5" />
    <rect x="640" y="278" width="12" height="12" rx="1.5" />
    <rect x="640" y="298" width="12" height="12" rx="1.5" />
    <!-- Clock in tower -->
    <circle cx="620" cy="264" r="5" />
    <line x1="620" y1="264" x2="620" y2="261" />
    <line x1="620" y1="264" x2="623" y2="264" />
    <!-- Door -->
    <rect x="614" y="304" width="12" height="16" rx="1" />
  </g>

  <!-- Group 3: Stylized Bus Outline (Mid Right: x=640, y=430) -->
  <g stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <rect x="630" y="420" width="54" height="34" rx="6" />
    <rect x="636" y="426" width="18" height="12" rx="2" />
    <rect x="658" y="426" width="20" height="12" rx="2" />
    <circle cx="644" cy="454" r="4.5" />
    <circle cx="670" cy="454" r="4.5" />
    <line x1="640" y1="444" x2="674" y2="444" />
  </g>

  <!-- Group 4: Second School Bus (Top: x=410, y=60) -->
  <g stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <rect x="400" y="55" width="46" height="28" rx="5" />
    <rect x="406" y="60" width="15" height="10" rx="1.5" />
    <rect x="425" y="60" width="15" height="10" rx="1.5" />
    <circle cx="412" cy="83" r="3.5" />
    <circle cx="434" cy="83" r="3.5" />
  </g>

  <!-- Group 5: Stylized Trees -->
  <!-- Tree 1 (Top left: x=340, y=80) -->
  <g stroke="#64748B" stroke-width="1.3" stroke-linecap="round" opacity="0.38">
    <path d="M 340 70 C 330 65, 325 50, 335 40 C 345 30, 360 35, 365 45 C 375 40, 385 55, 375 68 C 370 75, 355 78, 340 70 Z" />
    <line x1="352" y1="72" x2="352" y2="92" />
  </g>

  <!-- Tree 2 (Far right: x=740, y=360) -->
  <g stroke="#64748B" stroke-width="1.3" stroke-linecap="round" opacity="0.38">
    <path d="M 740 350 C 730 345, 725 330, 735 320 C 745 310, 760 315, 765 325 C 775 320, 785 335, 775 348 C 770 355, 755 358, 740 350 Z" />
    <line x1="752" y1="352" x2="752" y2="376" />
  </g>

  <!-- Tree 3 (Bottom: x=680, y=630) -->
  <g stroke="#64748B" stroke-width="1.3" stroke-linecap="round" opacity="0.38">
    <path d="M 670 630 L 685 605 L 700 630 Z" />
    <path d="M 673 620 L 685 600 L 697 620 Z" />
    <line x1="685" y1="630" x2="685" y2="646" />
  </g>

  <!-- Group 6: Stylized Waypoint Markers / Location Pins -->
  <!-- Pin 1 -->
  <g stroke="#64748B" stroke-width="1.4" opacity="0.45">
    <path d="M 260 178 C 253 178, 248 183, 248 190 C 248 198, 260 210, 260 210 C 260 210, 272 198, 272 190 C 272 183, 267 178, 260 178 Z" />
    <circle cx="260" cy="190" r="3.5" />
  </g>

  <!-- Pin 2 -->
  <g stroke="#64748B" stroke-width="1.4" opacity="0.45">
    <path d="M 560 98 C 553 98, 548 103, 548 110 C 548 118, 560 130, 560 130 C 560 130, 572 118, 572 110 C 572 103, 567 98, 560 98 Z" />
    <circle cx="560" cy="110" r="3.5" />
  </g>

  <!-- Pin 3 (Far right top: x=750, y=140) -->
  <g stroke="#64748B" stroke-width="1.4" opacity="0.45">
    <path d="M 750 128 C 743 128, 738 133, 738 140 C 738 148, 750 160, 750 160 C 750 160, 762 148, 762 140 C 762 133, 757 128, 750 128 Z" />
    <circle cx="750" cy="140" r="3.5" />
  </g>

  <!-- Pin 4 (Mid right: x=600, y=570) -->
  <g stroke="#64748B" stroke-width="1.4" opacity="0.45">
    <path d="M 600 558 C 593 558, 588 563, 588 570 C 588 578, 600 590, 600 590 C 600 590, 612 578, 612 570 C 612 563, 607 558, 600 558 Z" />
    <circle cx="600" cy="570" r="3.5" />
  </g>

  <!-- Pin 5 (Bottom: x=740, y=810) -->
  <g stroke="#64748B" stroke-width="1.4" opacity="0.45">
    <path d="M 740 798 C 733 798, 728 803, 728 810 C 728 818, 740 830, 740 830 C 740 830, 752 818, 752 810 C 752 803, 747 798, 740 798 Z" />
    <circle cx="740" cy="810" r="3.5" />
  </g>

  <!-- Group 7: Soft Clouds -->
  <g stroke="#64748B" stroke-width="1.2" opacity="0.32" stroke-linecap="round">
    <!-- Cloud 1 -->
    <path d="M 520 45 C 515 45, 510 49, 510 54 C 504 54, 500 58, 500 64 C 500 70, 505 74, 512 74 L 540 74 C 546 74, 550 70, 550 64 C 550 59, 546 55, 541 55 C 540 50, 535 45, 528 45 Z" />
    <!-- Cloud 2 -->
    <path d="M 710 215 C 706 215, 702 218, 702 222 C 697 222, 694 225, 694 230 C 694 235, 698 238, 704 238 L 726 238 C 731 238, 735 235, 735 230 C 735 226, 731 223, 728 223 C 727 219, 723 215, 717 215 Z" />
  </g>

  <!-- Group 8: Minimalist Round Clocks -->
  <!-- Clock 1 (Top right: x=770, y=220) -->
  <g stroke="#64748B" stroke-width="1.3" opacity="0.38">
    <circle cx="770" cy="220" r="11" />
    <line x1="770" y1="220" x2="770" y2="214" stroke-linecap="round" />
    <line x1="770" y1="220" x2="775" y2="220" stroke-linecap="round" />
  </g>

  <!-- Clock 2 (Bottom: x=620, y=780) -->
  <g stroke="#64748B" stroke-width="1.3" opacity="0.38">
    <circle cx="620" cy="780" r="9" />
    <line x1="620" y1="780" x2="620" y2="775" stroke-linecap="round" />
    <line x1="620" y1="780" x2="624" y2="780" stroke-linecap="round" />
  </g>

  <!-- Waypoint Nodes on Arterials -->
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" opacity="0.5">
    <circle cx="160" cy="220" r="4.5" />
    <circle cx="380" cy="460" r="4.5" />
    <circle cx="420" cy="720" r="4.5" />
    <circle cx="680" cy="240" r="4.5" />
    <circle cx="640" cy="880" r="4.5" />
  </g>
</svg>
